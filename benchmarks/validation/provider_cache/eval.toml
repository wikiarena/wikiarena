# Small benchmark for validating provider cache behavior.
# This is intentionally separate from the 500-task v0 config so transport and
# accounting changes can be tested before a full public rerun.

benchmark_id = "wikiarena_provider_cache_validation_graph_local_solver_v1"
taskset_id = "wikiarena_provider_cache_validation_v2"
taskset_path = "taskset.jsonl"

[rules.harness]
harness_id = "tool_strict_v1"
response_contract = "tool_call_only"
tool_name = "navigate"

[rules.navigation]
max_moves = 8
max_invalid_attempts_per_run = 6
max_invalid_attempts_per_step_context = 2
invalid_attempt_consumes_step_budget = false
terminate_on_invalid_budget_exhaustion = true
link_policy = "raw_ordered"
redirect_policy = "resolve_after_selection"

[rules.scoring]
exclude_system_failures_from_ranking = true
tie_breaker = "fewest_moves_then_draw"
unsolved_pair_policy = "skip"

[rules.execution]
request_timeout_ms = 180000
max_transport_retries = 2
initial_backoff_ms = 250
max_backoff_ms = 10000
jitter_ratio = 0.2
max_concurrency = 1

[run_options.navigation_runtime]
backend = "graph"
snapshot_id = "enwiki-20260401"

[run_options.solver_runtime]
backend = "local"
snapshot_id = "enwiki-20260401"

[concurrency]
max_concurrent_tasks = 1
max_concurrent_runs = 1

[concurrency.participant_max_concurrency]
gpt_5_4 = 1

[metadata]
purpose = "provider cache validation over short distance-2 and distance-3 tasks"
navigation_backend = "graph"
solver_backend = "local"
expected_task_count = 2
expected_shortest_path_lengths = [2, 3]
expected_minimum_api_calls_for_success = 2
long_task_expected_minimum_api_calls_for_success = 3
taskset_hash = "17bf0fbd337f4f391132027be4b71f1f50bca6f9da65e31651fbe900f4bd366b"

[[participants]]
participant_id = "gpt_5_4"
display_name = "GPT-5.4"
participant_kind = "llm"
driver_config = { provider = "codex", model = "gpt-5.4", settings = { reasoning_effort = "medium", timeout_s = 180, provider_settings = { codex_transport = "websocket_only" } } }
