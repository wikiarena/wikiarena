name: Deploy API

on:
  workflow_dispatch:
    inputs:
      artifact_key:
        description: 'Artifact key under s3://wikiarena-deployment-production/api/ (leave empty for latest)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  API_DOMAIN_NAME: api.wikiarena.org
  AWS_ACCOUNT_ID: "171436514933"
  AWS_REGION: us-west-2
  GRAPH_CHANNEL_KEY: graphs/enwiki/channels/production.json
  GRAPH_S3_BUCKET: wikiarena-graph-production
  DEPLOYMENT_BUCKET_NAME: wikiarena-deployment-production
  DEPLOYMENT_ARTIFACT_PREFIX: api
  INSTANCE_ENVIRONMENT: production
  INSTANCE_PROJECT: wikiarena
  INSTANCE_ROLE: api
  PYTHON_VERSION: "3.13"

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/wikiarena-production-github-actions-app
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine artifact key
        id: artifact
        run: |
          if [[ -n "${{ github.event.inputs.artifact_key }}" ]]; then
            ARTIFACT_KEY="${{ github.event.inputs.artifact_key }}"
          else
            ARTIFACT_KEY=$(aws s3api list-objects-v2 \
              --bucket "${{ env.DEPLOYMENT_BUCKET_NAME }}" \
              --prefix "${{ env.DEPLOYMENT_ARTIFACT_PREFIX }}/" \
              --query 'reverse(sort_by(Contents, &LastModified))[0].Key' \
              --output text)
          fi

          if [[ -z "$ARTIFACT_KEY" || "$ARTIFACT_KEY" == "None" ]]; then
            echo "No deployment artifact found in s3://${{ env.DEPLOYMENT_BUCKET_NAME }}/${{ env.DEPLOYMENT_ARTIFACT_PREFIX }}/" >&2
            exit 1
          fi

          VERSION_LABEL=$(basename "$ARTIFACT_KEY" .tar.gz)
          VERSION_LABEL=${VERSION_LABEL#wikiarena-api-}

          echo "artifact_key=$ARTIFACT_KEY" >> "$GITHUB_OUTPUT"
          echo "version_label=$VERSION_LABEL" >> "$GITHUB_OUTPUT"
          echo "artifact_uri=s3://${{ env.DEPLOYMENT_BUCKET_NAME }}/$ARTIFACT_KEY" >> "$GITHUB_OUTPUT"

      - name: Resolve API instance id
        id: instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              Name=tag:Project,Values=${{ env.INSTANCE_PROJECT }} \
              Name=tag:Environment,Values=${{ env.INSTANCE_ENVIRONMENT }} \
              Name=tag:Role,Values=${{ env.INSTANCE_ROLE }} \
              Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          PUBLIC_IP=$(aws ec2 describe-instances \
            --filters \
              Name=tag:Project,Values=${{ env.INSTANCE_PROJECT }} \
              Name=tag:Environment,Values=${{ env.INSTANCE_ENVIRONMENT }} \
              Name=tag:Role,Values=${{ env.INSTANCE_ROLE }} \
              Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "No running API instance found for deployment." >&2
            exit 1
          fi

          if [[ -z "$PUBLIC_IP" || "$PUBLIC_IP" == "None" ]]; then
            echo "Running API instance does not have a public IP yet." >&2
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

      - name: Trigger remote deploy over SSM
        id: command
        run: |
          for attempt in $(seq 1 30); do
            SSM_STATUS=$(aws ssm describe-instance-information \
              --filters Key=InstanceIds,Values=${{ steps.instance.outputs.instance_id }} \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || true)

            if [[ "$SSM_STATUS" == "Online" ]]; then
              break
            fi

            if [[ "$attempt" -eq 30 ]]; then
              echo "Instance never became available in SSM." >&2
              exit 1
            fi

            sleep 10
          done

          ARTIFACT_S3_URI='${{ steps.artifact.outputs.artifact_uri }}'
          RELEASE_VERSION='${{ steps.artifact.outputs.version_label }}'
          GRAPH_S3_BUCKET='${{ env.GRAPH_S3_BUCKET }}'
          GRAPH_CHANNEL_KEY='${{ env.GRAPH_CHANNEL_KEY }}'
          PYTHON_VERSION='${{ env.PYTHON_VERSION }}'

          REMOTE_SCRIPT=$(cat <<EOF
          set -euo pipefail

          cat >/opt/wikiarena/bin/sync-graph.sh <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail

          source /etc/wikiarena/wikiarena.env

          graph_bucket="\${WIKIARENA_GRAPH_S3_BUCKET:-${GRAPH_S3_BUCKET}}"
          graph_channel_key="\${WIKIARENA_GRAPH_CHANNEL_KEY:-${GRAPH_CHANNEL_KEY}}"
          graph_releases_dir="\${WIKIARENA_GRAPH_RELEASES_DIR:-/var/lib/wikiarena/graph/releases}"
          graph_current_dir="\${WIKIARENA_GRAPH_CURRENT_DIR:-/var/lib/wikiarena/graph/current}"

          tmp_dir="\$(mktemp -d)"
          trap 'rm -rf "\${tmp_dir}"' EXIT

          manifest_path="\${tmp_dir}/graph-channel.json"
          aws s3 cp "s3://\${graph_bucket}/\${graph_channel_key}" "\${manifest_path}"

          snapshot_id="\$(jq -r '.snapshot_id' "\${manifest_path}")"
          graph_key="\$(jq -r '.graph_key' "\${manifest_path}")"
          checksum_key="\$(jq -r '.checksum_key' "\${manifest_path}")"
          metadata_key="\$(jq -r '.metadata_key' "\${manifest_path}")"

          for required_value in "\${snapshot_id}" "\${graph_key}" "\${checksum_key}" "\${metadata_key}"; do
            if [[ -z "\${required_value}" || "\${required_value}" == "null" ]]; then
              echo "Graph channel manifest is missing required values" >&2
              exit 1
            fi
          done

          graph_release_dir="\${graph_releases_dir}/\${snapshot_id}"
          mkdir -p "\${graph_release_dir}"

          graph_file_name="\$(basename "\${graph_key}")"
          checksum_file_name="\$(basename "\${checksum_key}")"
          metadata_file_name="\$(basename "\${metadata_key}")"

          aws s3 cp "s3://\${graph_bucket}/\${checksum_key}" "\${graph_release_dir}/\${checksum_file_name}"
          aws s3 cp "s3://\${graph_bucket}/\${metadata_key}" "\${graph_release_dir}/\${metadata_file_name}"

          expected_graph_sha="\$(awk '{print \$1}' "\${graph_release_dir}/\${checksum_file_name}")"
          if [[ -z "\${expected_graph_sha}" ]]; then
            echo "Could not parse expected graph checksum from \${checksum_file_name}" >&2
            exit 1
          fi

          needs_download="true"
          if [[ -f "\${graph_release_dir}/\${graph_file_name}" ]]; then
            actual_graph_sha="\$(sha256sum "\${graph_release_dir}/\${graph_file_name}" | cut -d' ' -f1)"
            if [[ "\${actual_graph_sha}" == "\${expected_graph_sha}" ]]; then
              needs_download="false"
            fi
          fi

          if [[ "\${needs_download}" == "true" ]]; then
            aws s3 cp "s3://\${graph_bucket}/\${graph_key}" "\${graph_release_dir}/\${graph_file_name}.tmp"
            mv "\${graph_release_dir}/\${graph_file_name}.tmp" "\${graph_release_dir}/\${graph_file_name}"
            actual_graph_sha="\$(sha256sum "\${graph_release_dir}/\${graph_file_name}" | cut -d' ' -f1)"
            if [[ "\${actual_graph_sha}" != "\${expected_graph_sha}" ]]; then
              echo "Graph checksum mismatch for \${graph_file_name}" >&2
              exit 1
            fi
          fi

          ln -sfn "\${graph_file_name}" "\${graph_release_dir}/wikiarena_graph.bin"
          ln -sfn "\${metadata_file_name}" "\${graph_release_dir}/wikiarena_graph.metadata.json"
          rm -rf "\${graph_current_dir}"
          ln -sfn "\${graph_release_dir}" "\${graph_current_dir}"
          SCRIPT

          cat >/opt/wikiarena/bin/rollout-graph.sh <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail

          runuser -u wikiarena -- /opt/wikiarena/bin/sync-graph.sh

          systemctl daemon-reload
          systemctl enable wikiarena-api.service
          if ! systemctl restart wikiarena-api.service; then
            systemctl status wikiarena-api.service --no-pager || true
            journalctl -n 200 -u wikiarena-api.service --no-pager || true
            exit 1
          fi
          systemctl restart nginx.service

          source /etc/wikiarena/wikiarena.env

          graph_current_dir="\${WIKIARENA_GRAPH_CURRENT_DIR:-/var/lib/wikiarena/graph/current}"
          metadata_path="\${graph_current_dir}/wikiarena_graph.metadata.json"
          expected_snapshot_id="\$(jq -r '.snapshot_id // (.wiki + "-" + .dump_date)' "\${metadata_path}")"
          actual_snapshot_id="\$(curl --fail --show-error --silent "http://\${WIKIARENA_SERVER_HOST:-127.0.0.1}:\${WIKIARENA_SERVER_PORT:-8000}/v1/meta" | jq -r '.snapshot_id')"

          if [[ "\${actual_snapshot_id}" != "\${expected_snapshot_id}" ]]; then
            echo "Graph rollout loaded snapshot \${actual_snapshot_id}, expected \${expected_snapshot_id}" >&2
            exit 1
          fi
          SCRIPT

          chmod +x /opt/wikiarena/bin/sync-graph.sh /opt/wikiarena/bin/rollout-graph.sh

          artifact_s3_uri='${ARTIFACT_S3_URI}'
          release_version='${RELEASE_VERSION}'
          python_version='${PYTHON_VERSION}'
          release_dir="/opt/wikiarena/releases/\${release_version}"
          tmp_dir="\$(mktemp -d)"
          trap 'rm -rf "\${tmp_dir}"' EXIT

          rm -rf "\${release_dir}"
          mkdir -p "\${release_dir}"

          aws s3 cp "\${artifact_s3_uri}" "\${tmp_dir}/api.tar.gz"
          tar -xzf "\${tmp_dir}/api.tar.gz" -C "\${release_dir}"
          chown -R wikiarena:wikiarena "\${release_dir}"

          runuser -u wikiarena -- /usr/local/bin/uv python install "\${python_version}"
          runuser -u wikiarena -- /usr/local/bin/uv sync --directory "\${release_dir}" --frozen --no-dev --python "\${python_version}"

          ln -sfn "\${release_dir}" /opt/wikiarena/current
          printf 'WIKIARENA_SERVICE_VERSION=%s\n' "\${release_version}" >/etc/wikiarena/release.env
          chmod 640 /etc/wikiarena/release.env

          /opt/wikiarena/bin/rollout-graph.sh
          EOF
          )

          REMOTE_COMMAND=$(jq -nc \
            --arg command "$REMOTE_SCRIPT" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.instance_id }}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy WikiArena API ${{ steps.artifact.outputs.version_label }}" \
            --parameters "$REMOTE_COMMAND" \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for remote deploy to finish
        run: |
          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.command.outputs.command_id }}" \
              --instance-id "${{ steps.instance.outputs.instance_id }}" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                aws ssm get-command-invocation \
                  --command-id "${{ steps.command.outputs.command_id }}" \
                  --instance-id "${{ steps.instance.outputs.instance_id }}" \
                  --output json
                exit 1
                ;;
              Pending|InProgress|Delayed|Cancelling|"")
                sleep 10
                ;;
              *)
                echo "Unexpected SSM status: $STATUS" >&2
                sleep 10
                ;;
            esac
          done

          echo "Timed out waiting for remote deploy command to finish." >&2
          exit 1

      - name: Health check
        run: |
          curl --fail --show-error --silent \
            --retry 20 \
            --retry-delay 5 \
            "http://${{ steps.instance.outputs.public_ip }}/health"

      - name: Deployment summary
        run: |
          echo "## API Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: ${{ steps.artifact.outputs.artifact_uri }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.artifact.outputs.version_label }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Instance: ${{ steps.instance.outputs.instance_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Origin: http://${{ steps.instance.outputs.public_ip }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://${{ env.API_DOMAIN_NAME }}" >> "$GITHUB_STEP_SUMMARY"
