name: Build API Bundle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

env:
  AWS_ACCOUNT_ID: "171436514933"
  AWS_REGION: us-west-2
  DEPLOYMENT_BUCKET_NAME: wikiarena-deployment-production
  DEPLOYMENT_ARTIFACT_PREFIX: api
  PYTHON_VERSION: "3.13"

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run server tests
        run: |
          uv run pytest \
            --confcutdir=tests \
            tests/wikiarena/server \
            tests/wikiarena/graph/test_channel.py

      - name: Package API bundle
        id: package
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION_LABEL="${TIMESTAMP}-${COMMIT_SHA}"
          BUNDLE_PATH=$(bash scripts/package_api_bundle.sh dist "$VERSION_LABEL")
          echo "version_label=${VERSION_LABEL}" >> "$GITHUB_OUTPUT"
          echo "bundle_path=${BUNDLE_PATH}" >> "$GITHUB_OUTPUT"
          echo "s3_key=${{ env.DEPLOYMENT_ARTIFACT_PREFIX }}/wikiarena-api-${VERSION_LABEL}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: wikiarena-api-bundle
          path: ${{ steps.package.outputs.bundle_path }}
          retention-days: 30

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/wikiarena-production-github-actions-app
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload bundle to S3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          aws s3 cp \
            "${{ steps.package.outputs.bundle_path }}" \
            "s3://${{ env.DEPLOYMENT_BUCKET_NAME }}/${{ steps.package.outputs.s3_key }}"

      - name: Build summary
        run: |
          echo "## API Bundle Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.package.outputs.version_label }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bundle path: ${{ steps.package.outputs.bundle_path }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.ref }}" == "refs/heads/main" && "${{ github.event_name }}" == "push" ]]; then
            echo "- Uploaded to: s3://${{ env.DEPLOYMENT_BUCKET_NAME }}/${{ steps.package.outputs.s3_key }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- S3 upload skipped (not a push to main)" >> "$GITHUB_STEP_SUMMARY"
          fi
