[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wikiarena"
version = "0.0.1"
description = "Wiki Arena - a competitive evaluation for language models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.51.0",
    "fastapi>=0.115.12",
    "httpx>=0.28.1",
    "openai>=1.79.0",
    "platformdirs>=4.3.8",
    "pydantic>=2.11.4",
    "python-dotenv>=0.21.0",
    "requests>=2.32.3",
    "rich>=13.9.4",
    "typer>=0.15.4",
    "uvicorn[standard]>=0.34.2",
]

[project.scripts]
wikiarena = "wikiarena.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Test discovery and execution
testpaths = ["tests/wikiarena"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Essential: Enable src/ package imports during testing
pythonpath = ["src"]

# Output and behavior
addopts = [
    "--asyncio-mode=auto",
    "--tb=short",
    "--strict-markers",
    "-v",
]

# Async configuration
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

# Test markers for organization
markers = [
    "unit: Unit tests with no external dependencies",
    "integration: Integration tests with real dependencies", 
    "slow: Tests that take more than 1 second",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests", "scripts"]
extend-exclude = ["dumps"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[dependency-groups]
dev = [
    "aiohttp>=3.10.0",
    "awsebcli>=3.20.0",
    "mcp[cli]>=1.9.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.0",
]
